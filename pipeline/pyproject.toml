[project]
name = "lutece-pipeline"
version = "0.1.0"
description = "Offline data pipeline building the Lutèce heritage database"
readme = "README.md"
authors = [
    { name = "Nathan Tessot", email = "tessotnathan75@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "geopandas>=1.2.0",
    "httpx>=0.28.1",
    "onnx>=1.23.2",
    "onnxruntime>=1.31.0",
    "pandas>=3.0.6",
    "pillow>=12.3.0",
    "psycopg[binary]>=3.3.6",
    "pyarrow>=25.0.1",
    "rapidfuzz>=3.14.6",
    "scikit-learn>=1.9.1",
    "shapely>=2.2.0",
    "torch>=2.14.1",
    "transformers>=5.19.0",
]

[project.scripts]
lutece-pipeline = "lutece_pipeline:main"

[build-system]
requires = ["uv_build>=0.11.29,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]

[tool.ruff.lint]
# Require type hints everywhere (SPEC §0: typed Python).
extend-select = ["ANN"]
