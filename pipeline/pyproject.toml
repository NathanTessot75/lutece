[project]
name = "lutece-pipeline"
version = "0.1.0"
description = "Offline data pipeline building the Lutèce heritage database"
readme = "README.md"
authors = [
    { name = "Nathan Tessot", email = "tessotnathan75@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "geopandas>=1.2.0",
    "httpx>=0.28.1",
    "pandas>=3.0.6",
    "pyarrow>=25.0.1",
    "shapely>=2.2.0",
]

[project.scripts]
lutece-pipeline = "lutece_pipeline:main"

[build-system]
requires = ["uv_build>=0.11.29,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]

[tool.ruff.lint]
# Require type hints everywhere (SPEC §0: typed Python).
extend-select = ["ANN"]
